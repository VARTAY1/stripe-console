<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stripe Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;450;500;600;700&display=swap">
<style>
/* Layout: account tabs, a triage strip, a KPI band, then a masonry-ish grid of
   modules. Cool slate neutrals with a single indigo accent; semantic colour is
   reserved for account state so it never competes with the accent. */
:root{
  --bg:#eceff3; --surface:#fff; --surface-2:#f5f7fa; --surface-3:#eaeef3;
  --line:#dce2e9; --line-2:#c8d1db;
  --ink:#10151c; --ink-dim:#56626f; --ink-faint:#8795a3;
  --accent:#3b45b8; --accent-soft:#e7e9fb;
  --ok:#0a6b44; --ok-bg:#e2f3ea; --warn:#8a5200; --warn-bg:#fbf0dc;
  --bad:#a81e2a; --bad-bg:#fbe8e9; --info:#0b5f79; --info-bg:#e0f0f5;
  --display:"Bricolage Grotesque",ui-sans-serif,-apple-system,"Segoe UI",sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0a0d12; --surface:#141921; --surface-2:#1a212a; --surface-3:#222b36;
  --line:#28313d; --line-2:#36424f;
  --ink:#e8edf3; --ink-dim:#9aa7b6; --ink-faint:#6b7a8a;
  --accent:#9ba4ff; --accent-soft:#1a1f45;
  --ok:#5ed39d; --ok-bg:#0e2a1e; --warn:#e9b765; --warn-bg:#2b2113;
  --bad:#f28d94; --bad-bg:#2e1619; --info:#6fc6e0; --info-bg:#102a33;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a0d12; --surface:#141921; --surface-2:#1a212a; --surface-3:#222b36;
  --line:#28313d; --line-2:#36424f;
  --ink:#e8edf3; --ink-dim:#9aa7b6; --ink-faint:#6b7a8a;
  --accent:#9ba4ff; --accent-soft:#1a1f45;
  --ok:#5ed39d; --ok-bg:#0e2a1e; --warn:#e9b765; --warn-bg:#2b2113;
  --bad:#f28d94; --bad-bg:#2e1619; --info:#6fc6e0; --info-bg:#102a33;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;
  line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:24px 72px}

h1{font-family:var(--display);font-size:clamp(23px,3.2vw,31px);font-weight:700;
  letter-spacing:-.025em;margin:0;text-wrap:balance}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px}
.hdr .mini{padding:5px 11px;font-size:12px}
html{scroll-behavior:smooth}
.lede{color:var(--ink-dim);font-size:13.5px;margin:7px 0 20px;max-width:70ch}

/* key bar */
.keybar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.keybar input{flex:1 1 330px;min-width:0;font:inherit;font-size:14px;font-family:var(--mono);
  padding:11px 13px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.keybar input::placeholder{font-family:var(--body);color:var(--ink-faint)}
select,button{font:inherit;font-size:13.5px;border-radius:10px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink);padding:11px 13px;cursor:pointer}
button.primary{background:var(--accent);border-color:transparent;color:#fff;font-weight:600;padding-inline:19px}
:root[data-theme="dark"] button.primary,
:root:not([data-theme="light"]) button.primary{color:#0a0d12}
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]) button.primary{color:#fff} }
button:hover:not(:disabled){border-color:var(--accent)}
button.primary:hover:not(:disabled){filter:brightness(1.1);border-color:transparent}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:12.5px;color:var(--ink-faint);margin:0 0 24px;max-width:78ch}
.hint strong{color:var(--ink-dim);font-weight:600}
.hint code{font-family:var(--mono);font-size:11.5px}

/* account tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--line);
  padding-bottom:0}
.tab{display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--line);
  border-bottom:none;border-radius:10px 10px 0 0;background:var(--surface-2);color:var(--ink-dim);
  font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;
  border-color:var(--line);box-shadow:inset 0 2px 0 var(--accent)}
.tab .x{color:var(--ink-faint);font-size:15px;line-height:1;padding:0 2px;border:none;background:none}
.tab .x:hover{color:var(--bad)}
.tab .r{display:inline-flex;align-items:center;color:var(--ink-faint);padding:0 1px}
.tab .r:hover{color:var(--accent)}
.tab .r svg{width:13px;height:13px;display:block}
.tab.busy .r{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toolbar{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;font-size:12.5px;
  position:sticky;top:0;z-index:6;background:var(--bg);padding:8px 0 7px;box-shadow:0 1px 0 var(--line);
  color:var(--ink-faint)}
.toolbar .tb-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
.jump a{font-size:11.5px;text-decoration:none;color:var(--ink-dim);border:1px solid var(--line);border-radius:999px;
  padding:3px 10px;background:var(--surface)}
.jump a:hover{color:var(--accent);border-color:var(--accent)}
.group,.topgrid{scroll-margin-top:110px}
.tblbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
.tblbar input{flex:1 1 220px;min-width:0;font:inherit;font-size:12.5px;padding:6px 9px;border:1px solid var(--line);
  border-radius:7px;background:var(--surface-2);color:var(--ink)}
.chips{display:flex;gap:4px}
.chip{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink-dim);cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tblbar .cnt{font-size:11.5px;color:var(--ink-faint);margin-left:auto}
.scroll.tall{max-height:460px}
.tfoot{display:flex;gap:14px;flex-wrap:wrap;padding:9px 12px;font-size:12px;color:var(--ink-dim);border-top:1px solid var(--line)}
.tfoot b{color:var(--ink)}
.clr{font-size:11px;color:var(--ink-faint);white-space:nowrap}
.nw{white-space:nowrap}
.selc{width:30px;padding-right:0}
.selc input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;margin:0;vertical-align:middle}
.bulkbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);
  background:var(--accent-soft);font-size:12.5px;color:var(--ink)}
.bulkbar .spacer{flex:1}
dialog.dlg{border:1px solid var(--line-2);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;
  width:min(540px,calc(100vw - 32px));box-shadow:0 24px 60px rgba(0,0,0,.35)}
dialog.dlg::backdrop{background:rgba(6,8,12,.55);backdrop-filter:blur(2px)}
.dlg-body{padding:20px 22px;max-height:calc(100vh - 48px);overflow:auto}
.dlg-group{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.dlg-reason{font-size:12.5px;font-weight:600;color:var(--ink)}
.dlg-why{font-size:12.5px;color:var(--bad);margin-top:3px;line-height:1.45;word-break:break-word}
.dlg-head{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;margin-bottom:8px}
.dlg-detail{font-size:13px;color:var(--ink-dim);line-height:1.5}
.dlg-detail b{color:var(--ink)}
.dlg-amount{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12px;color:var(--ink-dim)}
.dlg-amount input{font:inherit;font-size:14px;font-family:var(--mono);padding:7px 10px;border-radius:8px;
  border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);width:150px}
.dlg-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.dlg-acts button{padding:8px 16px;font-size:13px;border-radius:9px;cursor:pointer;font-weight:600;
  border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink)}
.dlg-acts button:disabled{opacity:.6;cursor:wait}
.dlg-acts .yes{background:var(--bad);border-color:transparent;color:#fff}
.dlg-result.ok .dlg-head{color:var(--ok)} .dlg-result.no .dlg-head{color:var(--bad)}
.dlg-result.ok .dlg-acts .yes{background:var(--ok)}
.dlg-list{margin:8px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink-dim);max-height:220px;overflow:auto}
.dlg-list li{margin:2px 0}
.dlg-code{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.dlg-code code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:4px 8px;border-radius:6px;word-break:break-all}
.dlg-code a{color:var(--accent);word-break:break-all;font-size:12.5px}
.toolbar button{padding:7px 13px;font-size:12.5px}
.toolbar .fail{color:var(--bad)}
.toolbar .keyfp{font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:6px;padding:3px 9px;letter-spacing:.01em;word-break:break-all}
.toolbar .mini{padding:4px 9px;font-size:11.5px}
.toolbar .mini.done{color:var(--ok);border-color:var(--ok)}

/* triage */
.triage{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
.alert{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border-radius:10px;
  font-size:13.5px;border:1px solid currentColor}
.alert .what{font-weight:650}
.a-bad{background:var(--bad-bg);color:var(--bad)}
.a-warn{background:var(--warn-bg);color:var(--warn)}
.a-info{background:var(--info-bg);color:var(--info)}
.alert .detail{color:inherit;opacity:.85;font-weight:400}

/* KPI band */
.kpis{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:13px;overflow:hidden;margin-bottom:16px;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--surface);padding:14px 16px}
.kpi .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint);font-weight:600}
.kpi .val{font-family:var(--display);font-size:23px;font-weight:700;letter-spacing:-.025em;
  margin-top:6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .sub{font-size:11.5px;color:var(--ink-faint);margin-top:4px}
.kpi .val.bad{color:var(--bad)} .kpi .val.ok{color:var(--ok)}

/* module grid */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start}
.topgrid{display:grid;gap:14px;align-items:start;margin-bottom:14px;
  grid-template-columns:minmax(280px,340px) minmax(0,1fr)}
.topgrid > *{min-width:0}
.grid > *{min-width:0}
@media (max-width:780px){ .topgrid{grid-template-columns:1fr} }
.mod{background:var(--surface);border:1px solid var(--line);border-radius:13px;min-width:0;overflow:hidden}
.mod.wide{grid-column:1/-1}
.group{margin-top:22px}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-faint);font-weight:700;
  margin:0 0 10px;display:flex;align-items:center;gap:10px}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.quiet{font-size:12.5px;color:var(--ink-faint);margin:10px 0 0;padding:9px 14px;border:1px dashed var(--line-2);border-radius:10px}
.quiet b{color:var(--ink-dim);font-weight:600}
.mod header{display:flex;align-items:baseline;gap:9px;padding:13px 16px 11px;border-bottom:1px solid var(--line);
  background:var(--surface-2);flex-wrap:wrap}
.mod h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);
  font-weight:700;margin:0}
.mod .meta{font-size:11.5px;color:var(--ink-faint);margin-left:auto}
.mod .body{padding:13px 16px}
.mod .body.flush{padding:0}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.055em;color:var(--ink-faint);
  font-weight:600;padding:9px 8px;border-bottom:1px solid var(--line);background:var(--surface-2);
  position:sticky;top:0}
td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th:first-child,td:first-child{padding-left:12px}
th:last-child,td:last-child{padding-right:12px}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{max-height:320px;overflow:auto}
.mod .body table{min-width:0}
.mod .body > table, .scroll > table{display:table;width:100%}
.xscroll{overflow-x:auto}
.trunc{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mono{font-family:var(--mono);font-size:11.5px}
.muted{color:var(--ink-faint)}
.dim{color:var(--ink-dim)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 8px;
  border-radius:999px;white-space:nowrap;text-transform:uppercase}
.s-ok{background:var(--ok-bg);color:var(--ok)} .s-warn{background:var(--warn-bg);color:var(--warn)}
.s-bad{background:var(--bad-bg);color:var(--bad)} .s-info{background:var(--info-bg);color:var(--info)}
.s-live{background:var(--ok-bg);color:var(--ok)} .s-test{background:var(--warn-bg);color:var(--warn)}

dl.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;margin:0;font-size:13px}
dl.kv dt{color:var(--ink-faint)}
dl.kv dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* hour histogram */
.hours{display:flex;align-items:flex-end;gap:2px;height:84px;margin-top:4px}
.hours .h{flex:1;min-width:0;background:var(--accent-soft);border-radius:2px 2px 0 0;position:relative}
.hours .h i{position:absolute;inset:auto 0 0 0;background:var(--accent);border-radius:2px 2px 0 0;display:block}
.hourlbl{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-faint);margin-top:5px}

/* share bars */
.share{display:flex;flex-direction:column;gap:9px}
.share .row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12.5px}
.share .bar{grid-column:1/-1;height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.share .bar i{display:block;height:100%;background:var(--accent);border-radius:999px}

.btn-sm{font-size:11.5px;padding:4px 10px;border-radius:7px;border:1px solid var(--line-2);
  background:var(--surface-2);color:var(--ink-dim);cursor:pointer;white-space:nowrap;font-weight:500}
.btn-sm:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm.go{background:var(--accent);border-color:transparent;color:#fff;font-weight:600}
:root[data-theme="dark"] .btn-sm.go{color:#0a0d12}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .btn-sm.go{color:#0a0d12} }
.btn-sm.danger{background:var(--bad);border-color:transparent;color:#fff;font-weight:600}
.confirm{border:1px solid var(--bad);background:var(--bad-bg);color:var(--bad);border-radius:11px;
  padding:13px 15px;margin-bottom:14px;display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.confirm .what{font-weight:650;font-size:13.5px}
.confirm .detail{font-size:12.5px;opacity:.9}
.confirm input{font:inherit;font-size:13px;font-family:var(--mono);padding:6px 9px;border-radius:7px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);width:120px}
.confirm .spacer{flex:1}
.confirm .acts{display:flex;gap:8px;flex-shrink:0}
.confirm label{display:flex;align-items:center;gap:7px;white-space:nowrap}
.confirm button{padding:7px 14px;font-size:12.5px;border-radius:8px;cursor:pointer;font-weight:600;
  border:1px solid transparent}
.confirm .no{background:transparent;border-color:currentColor;color:inherit;font-weight:500}
.confirm .yes{background:var(--bad);color:#fff}
.flash{border-radius:11px;padding:12px 15px;margin-bottom:14px;font-size:13px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;border:1px solid currentColor}
.flash.ok{background:var(--ok-bg);color:var(--ok)}
.flash.no{background:var(--bad-bg);color:var(--bad)}
.flash .spacer{flex:1}
.flash code{font-family:var(--mono);font-size:12px;background:var(--surface);color:var(--ink);
  padding:3px 8px;border-radius:6px;overflow-wrap:anywhere}
.form{display:grid;gap:9px}
.form .row{display:flex;gap:8px;flex-wrap:wrap}
.form label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);
  font-weight:600;display:block;margin-bottom:4px}
.form input,.form select{font:inherit;font-size:13px;padding:8px 10px;border-radius:8px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);width:100%}
.form .grow{flex:1 1 130px;min-width:0}
.empty{border:1px dashed var(--line-2);border-radius:13px;padding:34px 20px;text-align:center;color:var(--ink-faint)}
.note{font-size:12.5px;color:var(--ink-dim);margin:0}
.locked{font-size:12.5px;color:var(--ink-faint);margin:0}
.errbox{padding:14px 16px;color:var(--bad);font-size:13px}
@media (max-width:560px){
  .alert{flex-direction:column;gap:3px}
  .kpi .val{font-size:21px}
  .wrap{padding-block:18px 56px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr"><h1>Stripe Console</h1>
    <button type="button" id="theme" class="mini" title="Switch between light and dark">Theme</button></div>

  <form class="keybar" id="form" autocomplete="off">
    <input id="key" type="password" required autocomplete="off" autocorrect="off"
           autocapitalize="off" spellcheck="false" placeholder="Paste a Stripe secret key, then Add account">
    <select id="days" aria-label="Reporting window">
      <option value="7">7 days</option>
      <option value="30" selected>30 days</option>
      <option value="90">90 days</option>
      <option value="365">1 year</option>
    </select>
    <button id="add" class="primary" type="submit">Add account</button>
    <button id="reset" type="button">Clear all</button>
  </form>

  <div id="tabs" class="tabs" role="tablist" hidden></div>
  <div id="panel"></div>
</div>

<dialog id="dlg" class="dlg" aria-labelledby="dlg-title"><div class="dlg-body"></div></dialog>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ZERO_DEC = new Set(["BIF","CLP","DJF","GNF","JPY","KMF","KRW","MGA","PYG","RWF","UGX","VND","VUV","XAF","XOF","XPF"]);

function money(minor, cur){
  cur = (cur || "").toUpperCase();
  const div = ZERO_DEC.has(cur) ? 1 : 100;
  const v = (minor || 0) / div;
  try { return new Intl.NumberFormat(undefined,{style:"currency",currency:cur,
        minimumFractionDigits: div === 1 ? 0 : 2}).format(v); }
  catch { return v.toFixed(div === 1 ? 0 : 2) + " " + cur; }
}
const sumList = l => (l && l.length) ? l.map(b => money(b.amount,b.currency)).join(" · ") : "—";
const dt = ts => ts ? new Date(ts*1000).toLocaleString(undefined,
  {month:"short",day:"2-digit",hour:"2-digit",minute:"2-digit"}) : "—";
const d8 = ts => ts ? new Date(ts*1000).toLocaleDateString(undefined,
  {year:"numeric",month:"short",day:"2-digit"}) : "—";
const lbl = s => String(s || "—").replace(/_/g," ");
const daysUntil = ts => Math.ceil((ts*1000 - Date.now()) / 86400000);
const pct = (a,b) => b ? Math.round(a/b*1000)/10 : 0;

/* ---------- Stripe ---------- */
async function sq(key, path, params){
  const url = new URL("https://api.stripe.com/v1/" + path);
  if (params) for (const [k,v] of Object.entries(params)) if (v !== undefined && v !== null) url.searchParams.set(k,v);
  const r = await fetch(url, {headers:{"Authorization":"Bearer "+key,"Stripe-Version":"2025-08-27.basil"}});
  const b = await r.json().catch(() => ({}));
  if (!r.ok){
    const e = new Error((b.error && b.error.message) || ("HTTP "+r.status));
    e.permission = r.status === 403 || /permission|not have access|restricted/i.test(e.message);
    throw e;
  }
  return b;
}

// Writes. Form-encoded, with an idempotency key so a double click cannot
// refund or pay out twice.
async function sp(key, path, params, idem){
  const body = new URLSearchParams();
  for (const [k,v] of Object.entries(params || {}))
    if (v !== undefined && v !== null && v !== "") body.set(k, v);
  const headers = {
    "Authorization": "Bearer " + key,
    "Stripe-Version": "2025-08-27.basil",
    "Content-Type": "application/x-www-form-urlencoded"
  };
  if (idem) headers["Idempotency-Key"] = idem;
  const r = await fetch("https://api.stripe.com/v1/" + path, {method:"POST", headers, body});
  const b = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((b.error && b.error.message) || ("HTTP " + r.status));
  return b;
}
const idemKey = () => "ui-" + Date.now() + "-" + Math.random().toString(36).slice(2,10);

const CALLS = since => ({
  account:   ["account"],
  balance:   ["balance"],
  btx:       ["balance_transactions", {limit:100}],
  charges:   ["charges", {limit:100, "created[gte]":since, "expand[]":"data.balance_transaction"}],
  payouts:   ["payouts", {limit:10}],
  disputes:  ["disputes", {limit:25}],
  efw:       ["radar/early_fraud_warnings", {limit:25}],
  refunds:   ["refunds", {limit:50}],
  customers: ["customers", {limit:100}],
  sessions:  ["checkout/sessions", {limit:100, status:"open"}],
  subs:      ["subscriptions", {limit:100, status:"active"}],
  invoices:  ["invoices", {limit:100}],
  events:    ["events", {limit:50}],
  acctEvents:["events", {limit:100, type:"account.updated"}]
});

async function load(key, days){
  const since = Math.floor(Date.now()/1000) - days*86400;
  const spec = CALLS(since);
  const names = Object.keys(spec);
  const res = await Promise.allSettled(names.map(n => sq(key, spec[n][0], spec[n][1])));
  const D = {}, ERR = {};
  names.forEach((n,i) => {
    if (res[i].status === "fulfilled") D[n] = res[i].value;
    else ERR[n] = {message: res[i].reason.message, permission: !!res[i].reason.permission};
  });
  if (!D.account) throw new Error(ERR.account ? ERR.account.message : "Could not read the account");
  return derive(key, days, D, ERR);
}

// "rk_live_" + the 10 characters after it + "…" + the last 10. Short keys are shown whole.
function fingerprint(key){
  const m = /^([rs]k_(?:live|test)_)(.*)$/.exec(key);
  const pre = m ? m[1] : "", rest = m ? m[2] : key;
  return rest.length > 24 ? pre + rest.slice(0,10) + "…" + rest.slice(-10) : key;
}
function derive(key, days, D, ERR){
  const a = D.account, S = a.settings || {};
  const list = k => (D[k] && D[k].data) || [];

  const charges = list("charges");
  const succ = charges.filter(c => c.status === "succeeded");
  const failed = charges.filter(c => c.status === "failed");

  // money by currency
  const cur = {};
  for (const c of succ){
    const k = (c.currency||"").toUpperCase();
    const b = cur[k] || (cur[k] = {currency:k, gross:0, refunded:0, count:0});
    b.gross += c.amount||0; b.refunded += c.amount_refunded||0; b.count++;
  }
  Object.values(cur).forEach(b => b.net = b.gross - b.refunded);
  const byCurrency = Object.values(cur).sort((x,y) => y.net - x.net);

  // balance transactions: fees, FX, clearing
  const btx = list("btx");
  const feeCur = {};
  let converted = 0, convertedTotal = 0;
  for (const t of btx){
    if (t.type !== "charge") continue;
    const k = (t.currency||"").toUpperCase();
    const f = feeCur[k] || (feeCur[k] = {currency:k, gross:0, fee:0, net:0, count:0});
    f.gross += t.amount||0; f.fee += t.fee||0; f.net += t.net||0; f.count++;
    if (t.exchange_rate){ converted++; convertedTotal += t.amount||0; }
  }
  const fees = Object.values(feeCur).sort((x,y) => y.gross - x.gross);

  const pendingTx = btx.filter(t => t.status === "pending" && t.available_on);
  // Group by the calendar day funds land, not the exact timestamp: Stripe
  // stamps each transaction individually, which would otherwise give one row
  // per payment instead of one row per payout day.
  const clearMap = {};
  for (const t of pendingTx){
    const d = new Date(t.available_on*1000);
    const k = d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()+"|"+t.currency;
    const r = clearMap[k] || (clearMap[k] = {on:t.available_on, currency:t.currency, net:0, count:0});
    r.net += t.net||0; r.count++;
    if (t.available_on < r.on) r.on = t.available_on;
  }
  const clearing = Object.values(clearMap).sort((x,y) => x.on - y.on);
  const newestCharge = btx.filter(t => t.type==="charge" && t.available_on && t.created)
                          .sort((x,y) => y.created - x.created)[0];
  const observedDays = newestCharge
    ? Math.round((newestCharge.available_on - newestCharge.created)/86400) : null;

  // decline reasons
  const declineMap = {};
  for (const c of failed){
    const k = c.failure_code || c.outcome && c.outcome.reason || "unknown";
    const r = declineMap[k] || (declineMap[k] = {code:k, count:0, amount:0, currency:c.currency,
      message:c.failure_message || ""});
    r.count++; r.amount += c.amount||0;
  }
  const declines = Object.values(declineMap).sort((x,y) => y.count - x.count);

  // who to chase: failed, never succeeded
  const okEmails = new Set(succ.map(c => ((c.billing_details&&c.billing_details.email)||c.receipt_email||"").toLowerCase()).filter(Boolean));
  const chaseMap = {};
  for (const c of failed){
    const em = ((c.billing_details&&c.billing_details.email)||c.receipt_email||"").toLowerCase();
    if (!em || okEmails.has(em)) continue;
    const r = chaseMap[em] || (chaseMap[em] = {email:em, tries:0, amount:0, currency:c.currency, last:0, why:""});
    r.tries++; r.amount = Math.max(r.amount, c.amount||0);
    if ((c.created||0) > r.last){ r.last = c.created; r.why = c.failure_message || lbl(c.failure_code||""); }
  }
  const chase = Object.values(chaseMap).sort((x,y) => y.amount - x.amount);

  // card mix + hours + repeat
  const brandMap = {}, countryMap = {}, hours = new Array(24).fill(0);
  const emailCount = {};
  for (const c of succ){
    const card = (c.payment_method_details && c.payment_method_details.card) || {};
    const b = (card.brand || "other").toLowerCase();
    brandMap[b] = (brandMap[b]||0) + 1;
    const co = (card.country || "??").toUpperCase();
    countryMap[co] = (countryMap[co]||0) + 1;
    if (c.created) hours[new Date(c.created*1000).getHours()]++;
    const em = ((c.billing_details&&c.billing_details.email)||c.receipt_email||"").toLowerCase();
    if (em) emailCount[em] = (emailCount[em]||0) + 1;
  }
  const share = m => Object.entries(m).map(([k,v]) => ({k,v})).sort((x,y) => y.v - x.v);
  const buyers = Object.keys(emailCount).length;
  const repeat = Object.values(emailCount).filter(n => n > 1).length;

  const topCur = byCurrency[0];
  const aov = topCur && topCur.count ? Math.round(topCur.gross / topCur.count) : null;

  // disputes & fraud
  const disputes = list("disputes").filter(d => d.status !== "won" && d.status !== "warning_closed");
  const efw = list("efw").filter(w => !w.actionable === false || true);
  const openDisputeAmt = disputes.reduce((n,d) => n + (d.amount||0), 0);

  // subscriptions & invoices
  const subs = list("subs");
  const mrrMap = {};
  for (const s of subs){
    for (const it of ((s.items && s.items.data) || [])){
      const p = it.price || {}; const rec = p.recurring || {};
      if (!p.unit_amount) continue;
      const qty = it.quantity || 1;
      let per = p.unit_amount * qty;
      const iv = rec.interval, ic = rec.interval_count || 1;
      if (iv === "year") per = per / (12*ic);
      else if (iv === "week") per = per * (52/12) / ic;
      else if (iv === "day") per = per * 30 / ic;
      else per = per / ic;
      const k = (p.currency||"").toUpperCase();
      mrrMap[k] = (mrrMap[k]||0) + per;
    }
  }
  const mrr = Object.entries(mrrMap).map(([currency,amount]) => ({currency, amount:Math.round(amount)}));
  const unpaid = list("invoices").filter(i => i.status === "open");
  const sessions = list("sessions").filter(s => s.payment_status === "unpaid");

  const ext = (a.external_accounts && a.external_accounts.data) || [];
  const bank = ext.find(e => e.object === "bank_account") || ext[0] || null;

  // When did payouts / charges go off, and when was the restriction applied? Read from
  // account.updated events (newest first; Stripe keeps 30 days of events).
  const acctEv = list("acctEvents");
  const flipAt = field => {
    const e = acctEv.find(ev => ev.data && ev.data.previous_attributes && ev.data.previous_attributes[field] === true
      && ev.data.object && ev.data.object[field] === false);
    return e ? e.created : null;
  };
  const payoutsDisabledAt = flipAt("payouts_enabled"), chargesDisabledAt = flipAt("charges_enabled");
  const restrictedEv = acctEv.find(ev => ev.data && ev.data.previous_attributes && ev.data.previous_attributes.requirements
    && ("disabled_reason" in ev.data.previous_attributes.requirements) && ev.data.object && ev.data.object.requirements
    && ev.data.object.requirements.disabled_reason);
  const restrictedAt = restrictedEv ? restrictedEv.created : null;
  const acctEventsOldest = acctEv.length ? acctEv[acctEv.length - 1].created : null;

  // Requirements from the account and from each capability, merged.
  const capsDetail = list("caps").map(c => ({id:c.id, status:c.status, req:c.requirements || null}));
  const capReq = k => capsDetail.flatMap(c => (c.req && c.req[k]) || []);
  const R = a.requirements || {}, FR = a.future_requirements || {};
  const uniq = l => [...new Set(l)];
  const currentlyDue = uniq([...(R.currently_due||[]), ...capReq("currently_due")]);
  const pastDue = uniq([...(R.past_due||[]), ...capReq("past_due")]);
  const pendingVerification = uniq([...(R.pending_verification||[]), ...capReq("pending_verification")]);
  const eventuallyDue = uniq([...(R.eventually_due||[]), ...capReq("eventually_due"), ...(FR.currently_due||[])]);
  const reqErrors = [...(R.errors||[]), ...capReq("errors")].map(e => ({code:e.code, reason:e.reason, requirement:e.requirement}));
  const deadlines = [R.current_deadline, ...capsDetail.map(c => c.req && c.req.current_deadline)].filter(Boolean);
  const deadline = deadlines.length ? Math.min(...deadlines) : null;
  const capDisabled = capsDetail.filter(c => c.req && c.req.disabled_reason).map(c => ({id:c.id, reason:c.req.disabled_reason}));
  const disabledReason = R.disabled_reason || (capDisabled[0] && capDisabled[0].reason) || null;
  // the account.updated event that switched charges or payouts off, with every attribute it changed
  const switchEv = acctEv.find(ev => ev.data && ev.data.previous_attributes
    && (ev.data.previous_attributes.payouts_enabled === true || ev.data.previous_attributes.charges_enabled === true));
  const flat = (o, pre = "") => Object.entries(o || {}).flatMap(([k,v]) =>
    (v && typeof v === "object" && !Array.isArray(v)) ? flat(v, pre + k + ".") : [[pre + k, v]]);
  const getPath = (o, path) => path.split(".").reduce((x,k) => (x && typeof x === "object") ? x[k] : undefined, o);
  const switchChanges = switchEv ? flat(switchEv.data.previous_attributes).map(([path, old]) => ({path, old, now: getPath(switchEv.data.object, path)})) : [];

  // settlement totals of succeeded charges in the window, in the currency Stripe settled them in
  const btOf = c => (c.balance_transaction && typeof c.balance_transaction === "object") ? c.balance_transaction : null;
  const settleMap = {};
  for (const c of succ){
    const bt = btOf(c); if (!bt) continue;
    const r = settleMap[bt.currency] || (settleMap[bt.currency] = {currency:bt.currency, gross:0, fee:0, net:0, count:0});
    r.gross += bt.amount||0; r.fee += bt.fee||0; r.net += bt.net||0; r.count++;
  }
  const settled = Object.values(settleMap).sort((x,y) => y.net - x.net);

  return {
    key: key.slice(0,11) + "…", days,
    fp: fingerprint(key),
    mode: /_live_/.test(key) ? "LIVE" : /_test_/.test(key) ? "TEST" : "UNKNOWN",
    restricted: /^rk_/.test(key),
    err: ERR,
    id: a.id,
    name: (S.dashboard && S.dashboard.display_name) || (a.business_profile && a.business_profile.name) || a.id,
    created: a.created, email: a.email,
    country: a.country || "—", currency: (a.default_currency||"").toUpperCase() || "—",
    timezone: (S.dashboard && S.dashboard.timezone) || "—",
    businessType: a.business_type, acctType: a.type,
    url: a.business_profile && a.business_profile.url,
    statement: (S.payments && S.payments.statement_descriptor) || null,
    chargesEnabled: a.charges_enabled, payoutsEnabled: a.payouts_enabled,
    detailsSubmitted: a.details_submitted,
    schedule: (S.payouts && S.payouts.schedule && S.payouts.schedule.interval) || "—",
    delayDays: S.payouts && S.payouts.schedule ? S.payouts.schedule.delay_days : null,
    currentlyDue, pastDue, deadline, disabledReason, pendingVerification, eventuallyDue, reqErrors,
    capDisabled, capsDetail, capabilities: a.capabilities || {},
    requirementsRaw: a.requirements || null, futureRequirementsRaw: a.future_requirements || null,
    switchAt: switchEv ? switchEv.created : null, switchChanges,
    payoutsDisabledAt, chargesDisabledAt, restrictedAt, acctEventsOldest,
    bank,
    available: (D.balance && D.balance.available) || [],
    pending: (D.balance && D.balance.pending) || [],
    reserved: (D.balance && D.balance.connect_reserved) || [],
    byCurrency, fees, converted, convertedTotal, clearing, observedDays, settled,
    counts: {
      total: charges.length, hasMore: !!(D.charges && D.charges.has_more),
      succeeded: succ.length, failed: failed.length,
      refunded: charges.filter(c => (c.amount_refunded||0) > 0).length,
      disputed: charges.filter(c => c.disputed).length
    },
    declines, chase, aov, buyers, repeat,
    brands: share(brandMap), countries: share(countryMap), hours,
    recent: charges.slice(0,50).map(c => { const bt = btOf(c); return {
      id:c.id,
      // what Stripe actually settled for this payment: fee, net and clearing date, in the settlement currency
      settle: bt ? {on:bt.available_on, status:bt.status, gross:bt.amount||0, fee:bt.fee||0, net:bt.net||0,
                    currency:bt.currency, rate:bt.exchange_rate||null} : null,
      refundable: Math.max(0, (c.amount||0) - (c.amount_refunded||0)),
      created:c.created,
      state: c.disputed ? "disputed"
           : (c.amount_refunded||0) >= (c.amount||0) && (c.amount_refunded||0) > 0 ? "refunded"
           : (c.amount_refunded||0) > 0 ? "part refund" : c.status,
      amount:c.amount||0, currency:c.currency,
      who:(c.billing_details&&c.billing_details.email)||c.receipt_email||(c.billing_details&&c.billing_details.name)||"—",
      brand:(c.payment_method_details&&c.payment_method_details.card&&c.payment_method_details.card.brand)||"",
      note:c.description||c.failure_message||""
    }; }),
    payouts: list("payouts").map(p => ({id:p.id, arrival:p.arrival_date, amount:p.amount||0, currency:p.currency,
      status:p.status, failure:p.failure_message, method:p.method})),
    disputes: disputes.map(d => ({id:d.id, charge:(typeof d.charge === "string" ? d.charge : (d.charge && d.charge.id)) || null,
      amount:d.amount, currency:d.currency, reason:d.reason, status:d.status,
      due:(d.evidence_details&&d.evidence_details.due_by)||null,
      submitted:(d.evidence_details&&d.evidence_details.submission_count)||0, created:d.created})),
    openDisputeAmt,
    efw: efw.map(w => ({created:w.created, reason:w.reason, actionable:w.actionable, charge:w.charge})),
    refunds: list("refunds").slice(0,25).map(r => ({created:r.created, amount:r.amount, currency:r.currency,
      reason:r.reason, status:r.status})),
    customersTotal: list("customers").length,
    customersMore: !!(D.customers && D.customers.has_more),
    newCustomers: list("customers").filter(c => c.created >= Math.floor(Date.now()/1000) - days*86400).length,
    subs: subs.length, mrr,
    unpaid: unpaid.map(i => ({number:i.number, amount:i.amount_due, currency:i.currency,
      due:i.due_date, email:i.customer_email, created:i.created})),
    unpaidTotal: unpaid.reduce((n,i) => n + (i.amount_due||0), 0),
    unpaidCur: unpaid[0] ? unpaid[0].currency : null,
    sessions: sessions.length,
    sessionsValue: sessions.reduce((n,s) => n + (s.amount_total||0), 0),
    sessionsCur: sessions[0] ? sessions[0].currency : null,
    events: list("events").slice(0,25).map(e => ({created:e.created, type:e.type}))
  };
}

/* ---------- actions ----------
   Nothing runs on the first click. An action becomes a confirmation strip
   naming the exact amount and recipient; only the second, explicitly-labelled
   click sends it. */
let pending = null;   // {what, detail, label, amount:{value,currency,max}, run(amountMinor)}
let flash = null;     // {ok, text, code, link}
let working = false;

/* ---------- the confirmation window ----------
   Every action opens the same <dialog> over the page: the question, an editable amount
   where there is one, Cancel and the final button. While Stripe works the window shows
   progress; then it shows the result with Done. Esc or a click outside cancels; Enter
   confirms. Nothing fires on the first click, and nothing is drawn at the top of the page. */
const dlg = () => document.getElementById("dlg");
function showDialog(html, focusSel){
  const d = dlg(); d.querySelector(".dlg-body").innerHTML = html;
  if (!d.open) d.showModal();
  const f = focusSel && d.querySelector(focusSel); if (f) f.focus();
}
function closeDialog(){ const d = dlg(); if (d.open) d.close(); pending = null; flash = null; }

function ask(cfg){
  pending = cfg; flash = null;
  const a = cfg.amount;
  showDialog(`<div class="dlg-head">${cfg.what}</div>
    <div class="dlg-detail">${cfg.detail || ""}</div>
    ${a ? `<label class="dlg-amount">Amount
      <input id="confirm-amount" type="number" step="0.01" min="0.01"
             max="${(a.max/100).toFixed(2)}" value="${(a.value/100).toFixed(2)}">
      <span>${esc((a.currency || "").toUpperCase())}</span></label>` : ""}
    <div class="dlg-acts">
      <button type="button" class="no" data-ask-no>Cancel</button>
      <button type="button" class="yes" data-ask-yes>${esc(cfg.label)}</button>
    </div>`, a ? "#confirm-amount" : "[data-ask-no]");
}

function confirmNow(){
  if (!pending || working) return;
  const f = document.getElementById("confirm-amount");
  const cur = pending.amount ? pending.amount.currency : null;
  runPending(f ? minor(f.value, cur) : null);
}

async function runPending(amountMinor){
  const job = pending;
  pending = null;
  if (!job || working) return;
  working = true;
  const progress = txt => showDialog(`<div class="dlg-head">Working…</div>
    <div class="dlg-detail">${esc(txt)}</div>
    <div class="dlg-acts"><button type="button" class="no" disabled>Please wait</button></div>`);
  progress("Sending to Stripe…");
  try {
    const out = await job.run(amountMinor, progress);
    flash = Object.assign({ok:true}, typeof out === "string" ? {text:out} : out);
  } catch(e){
    flash = {ok:false, text: e.message || String(e)};
  }
  working = false;
  showDialog(resultHtml(flash), "[data-flash-close]");
  if (job.reread !== false) refreshAccount(active);
}

function resultHtml(f){
  return `<div class="dlg-result ${f.ok ? "ok" : "no"}">
    <div class="dlg-head">${f.ok ? (f.partial ? "Partly done" : "Done") : "Stripe refused"}</div>
    <div class="dlg-detail">${esc(f.text)}</div>
    ${f.lines && f.lines.length ? `<ul class="dlg-list">${f.lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul>` : ""}
    ${f.groups && f.groups.length ? f.groups.map(g => `<div class="dlg-group">
      <div class="dlg-reason">${g.items.length === 1 ? "1 payment" : g.items.length + " payments"} not refunded</div>
      <div class="dlg-why">${esc(g.reason)}</div>
      <ul class="dlg-list">${g.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join("") : ""}
    ${f.code && f.code !== f.link ? `<div class="dlg-code"><code>${esc(f.code)}</code>
      <button type="button" class="btn-sm" data-copy="${esc(f.code)}">Copy</button></div>` : ""}
    ${f.link ? `<div class="dlg-code"><a href="${esc(f.link)}" target="_blank" rel="noreferrer">${esc(f.link)}</a>
      <button type="button" class="btn-sm" data-copy="${esc(f.link)}">Copy</button></div>` : ""}
    <div class="dlg-acts"><button type="button" class="yes" data-flash-close>Done</button></div>
  </div>`;
}

(function(){
  const d = dlg();
  d.addEventListener("cancel", ev => { ev.preventDefault(); if (!working) closeDialog(); });
  d.addEventListener("click", ev => { if (ev.target === d && !working) closeDialog(); });
  d.addEventListener("keydown", ev => {
    if (ev.key === "Enter" && pending && !working && !ev.target.closest("button")){ ev.preventDefault(); confirmNow(); }
  });
})();

/* ---------- rendering ---------- */
const mod = (title, meta, body, cls) =>
  `<section class="mod${cls?" "+cls:""}"><header><h2>${esc(title)}</h2>${
    meta ? `<span class="meta">${esc(meta)}</span>` : ""}</header>${body}</section>`;
const locked = (A, k, what) => A.err[k]
  ? `<div class="body"><p class="locked">${A.err[k].permission
      ? `This key cannot read ${esc(what)}. Add the permission in Stripe → Developers → API keys.`
      : esc(A.err[k].message)}</p></div>` : null;

function triage(A){
  const out = [];
  const add = (k, what, detail) => out.push(`<div class="alert a-${k}"><span class="what">${what}</span>
    <span class="detail">${detail}</span></div>`);
  // Only account restrictions are surfaced here, by the owner's choice (2026-10-27).
  if (A.disabledReason) add("bad","Account restricted", esc(DISABLED_WHY[A.disabledReason] || lbl(A.disabledReason)) + (A.restrictedAt ? ` · since ${esc(dt(A.restrictedAt))}` : ""));
  if (A.chargesEnabled === false) add("bad","Charges disabled","This account cannot take payments.");
  if (A.payoutsEnabled === false) add("warn","Payouts disabled","Money builds up but will not reach the bank.");
  return out.length ? `<div class="triage">${out.join("")}</div>` : "";
}

function kpis(A){
  const net = A.byCurrency.length ? A.byCurrency.map(c => money(c.net,c.currency)).join(" · ") : "—";
  const feeTotal = A.fees.length ? A.fees.map(f => money(f.fee,f.currency)).join(" · ") : "—";
  const feeRate = A.fees.length && A.fees[0].gross ? pct(A.fees[0].fee, A.fees[0].gross) : null;
  const attn = A.counts.failed + A.counts.disputed + A.efw.filter(w=>w.actionable).length;
  const k = (l,v,s,c) => `<div class="kpi"><div class="lbl">${l}</div>
    <div class="val${c?" "+c:""}">${v}</div><div class="sub">${s}</div></div>`;
  return `<div class="kpis">
    ${k("Available", esc(sumList(A.available)), "ready to pay out")}
    ${k("Pending", esc(sumList(A.pending)), A.observedDays != null ? `clears in ~${A.observedDays}d` : "still settling")}
    ${k("Net · "+A.days+"d", esc(net), `${A.counts.succeeded} payment${A.counts.succeeded===1?"":"s"}${
        A.settled && A.settled.length ? " · " + A.settled.map(x => esc(money(x.net,x.currency))).join(" · ") + " after fees" : ""}`)}
    ${k("Stripe fees · "+A.days+"d", esc(feeTotal), feeRate != null ? feeRate+"% of gross" : "—")}
    ${k("Average order", A.aov != null ? esc(money(A.aov, A.byCurrency[0].currency)) : "—",
        A.buyers ? `${A.buyers} buyer${A.buyers===1?"":"s"}, ${A.repeat} repeat` : "—")}
    ${k("Needs attention", attn, `${A.counts.failed} failed · ${A.disputes.length} disputed`, attn ? "bad" : "ok")}
  </div>`;
}

// A disputed payment cannot be refunded; Stripe already took the money back. It can only be
// accepted (closed without evidence), which leaves the money with the customer.

const canRefund = c => c.refundable > 0 && c.state !== "failed" && c.state !== "disputed";

  "rejected.listed": "Stripe rejected the account: listed by a card network or regulator",
  "rejected.other": "Stripe rejected the account",
  "listed": "The account is on a prohibited list",
  "platform_paused": "Paused by the platform",
  "other": "Restricted by Stripe for another reason"

const offSince = (A, ts) => ts ? `<div class="clr">off since ${esc(dt(ts))}</div>`
  : A.err && A.err.acctEvents ? `<div class="clr">time unknown — key cannot read events</div>`
  : `<div class="clr">off since before ${A.acctEventsOldest ? esc(d8(A.acctEventsOldest)) : "the last 30 days"} (older than Stripe's event history)</div>`;

          ? `<button type="button" class="btn-sm" data-refund="${esc(c.id)}">Refund</button>`
          : (c.state === "disputed" && openDisputeFor(A, c))
            ? `<button type="button" class="btn-sm" data-accept-dispute="${esc(openDisputeFor(A, c).id)}" title="Let the customer keep the money and close the dispute">Accept dispute</button>` : ""}</td></tr>`).join("")
        : `<tr><td colspan="9" class="muted">No payments in this window.</td></tr>`}
    </tbody></table></div>
    <div class="tfoot">${A.settled && A.settled.length
      ? `<span>Succeeded in ${A.days}d:</span>` + A.settled.map(x => `<span><b>${esc(money(x.net,x.currency))}</b> net to you ·
          ${esc(money(x.fee,x.currency))} Stripe fees · ${esc(money(x.gross,x.currency))} gross · ${x.count} payment${x.count===1?"":"s"}</span>`).join("")
      : `<span class="muted">No settled payments in this window.</span>`}</div>
  </div>`);

  const accountMod = mod("Account", null, `<div class="body"><dl class="kv">
    <dt>Opened</dt><dd>${esc(d8(A.created))}${A.created ? ` <span class="muted">· ${
      Math.floor((Date.now()/1000 - A.created)/86400)} days ago</span>` : ""}</dd>
    <dt>Account ID</dt><dd class="mono">${esc(A.id)}</dd>
    <dt>Email</dt><dd class="trunc">${esc(A.email||"—")}</dd>
    <dt>Country · currency</dt><dd>${esc(A.country)} · ${esc(A.currency)}</dd>
    <dt>Time zone</dt><dd>${esc(A.timezone)}</dd>
    <dt>Business type</dt><dd>${esc(lbl(A.businessType||"—"))}</dd>
    <dt>Statement name</dt><dd>${esc(A.statement||"—")}</dd>
    <dt>Payout account</dt><dd>${A.bank ? esc((A.bank.bank_name||A.bank.object)+" ····"+(A.bank.last4||"")) : "—"}</dd>
    <dt>Charges</dt><dd><span class="pill ${A.chargesEnabled?"s-ok":"s-bad"}">${A.chargesEnabled?"enabled":"off"}</span>${A.chargesEnabled ? "" : offSince(A, A.chargesDisabledAt)}</dd>
    <dt>Payouts</dt><dd><span class="pill ${A.payoutsEnabled?"s-ok":"s-bad"}">${A.payoutsEnabled?"enabled":"off"}</span>
      <span class="muted">${esc(lbl(A.schedule))}${A.delayDays!=null?` +${A.delayDays}d`:""}</span>${A.payoutsEnabled ? "" : offSince(A, A.payoutsDisabledAt)}</dd>
  </dl></div>`);

  /* ---- render the groups ---- */
  const LABEL = {money:"Money", payments:"Payments", actions:"Actions", risk:"Risk", customers:"Customers", account:"Activity"};
  const jump = [{id:"top-row", label:"Account & payments"}];
  const sections = Object.keys(G).map(g => {
    const live = G[g].filter(m => !m.empty), quiet = G[g].filter(m => m.empty);
    if (!live.length && !quiet.length) return "";
    jump.push({id:"grp-"+g, label:LABEL[g]});
    return `<section class="group" id="grp-${g}"><h3 class="grp">${LABEL[g]}</h3>
      ${live.length ? `<div class="grid">${live.map(m => m.html).join("")}</div>` : ""}
      ${quiet.length ? `<p class="quiet"><b>Nothing to report</b> · ${quiet.map(m => esc(m.title)).join(" · ")}</p>` : ""}
    </section>`;
  }).join("");

  A._jump = jump;
  return triage(A) + kpis(A)
       + `<div class="topgrid" id="top-row">${accountMod}${recentMod}</div>` + sections;
}

/* ---------- state ---------- */
// {key, A, at} or {error}. The key stays in memory only, so Refresh can re-read
// the account; it is never written to disk or browser storage, and closing the
// tab or pressing Clear all discards it.
const accounts = [];
let active = 0;

const REFRESH_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>`;

async function refreshAccount(i){
  const row = accounts[i];
  if (!row || !row.key || row.busy) return;
  row.busy = true; row.failed = null; render();
  try {
    const prev = row.A;
    row.A = await load(row.key, row.A ? row.A.days : 30);
    if (prev && prev._sel) row.A._sel = prev._sel;
    row.at = Date.now();
  } catch(e){
    row.failed = e.message || String(e);   // keep the previous reading on screen
  } finally {
    row.busy = false; render();
  }
}

const ago = ms => {
  const n = Math.round((Date.now() - ms)/1000);
  if (n < 60) return "just now";
  if (n < 3600) return Math.floor(n/60) + " min ago";
  return new Date(ms).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
};

function render(){
  const tabs = $("#tabs"), panel = $("#panel");
  if (!accounts.length){
    tabs.hidden = true;
    panel.innerHTML = `<div class="empty">Paste a Stripe secret key above and press Add account.</div>`;
    return;
  }
  tabs.hidden = false;
  tabs.innerHTML = accounts.map((a,i) => `<button class="tab${a.busy?" busy":""}" role="tab" data-i="${i}"
    aria-selected="${i===active}">${esc(a.error ? "Unreadable" : a.A.name)}
    ${a.error ? "" : `<span class="pill ${a.A.mode==="LIVE"?"s-live":"s-test"}">${esc(a.A.mode)}</span>`}
    ${a.error ? "" : `<span class="r" data-refresh="${i}" title="Refresh this account">${REFRESH_ICON}</span>`}
    <span class="x" data-close="${i}" title="Remove">×</span></button>`).join("");
  const cur = accounts[active];
  if (cur.error){
    panel.innerHTML = `<section class="mod"><div class="errbox">${esc(cur.error)}</div></section>`;
    return;
  }
  const body = panelFor(cur.A);
  const jump = (cur.A._jump || []).map(j => `<a href="#${j.id}">${esc(j.label)}</a>`).join("");
  const bar = `<div class="toolbar"><div class="tb-row">
    <span class="keyfp" title="The key this tab is using">${esc(cur.reveal ? cur.key : cur.A.fp)}</span>
    <button type="button" class="mini" data-reveal="${active}" title="${cur.reveal ? "Hide the full key" : "Show the full key"}">${cur.reveal ? "Hide" : "Show"}</button>
    <button type="button" class="mini${cur.copied ? " done" : ""}" data-copy-key="${active}" title="Copy the full key to the clipboard">${cur.copied ? "Copied ✓" : "Copy key"}</button>
    <span>${cur.busy ? "Refreshing…" : "Updated " + esc(ago(cur.at))}</span>
    ${cur.copyErr ? `<span class="fail">${esc(cur.copyErr)}</span>` : ""}
    ${cur.failed ? `<span class="fail">· refresh failed: ${esc(cur.failed)} (showing the last good reading)</span>` : ""}
    <span class="spacer"></span>
    <button type="button" data-refresh="${active}" ${cur.busy ? "disabled" : ""}>Refresh this account</button>
  </div>${jump ? `<div class="tb-row jump">${jump}</div>` : ""}</div>`;
  panel.innerHTML = bar + body;
  applyRecentFilter(cur);
}

document.addEventListener("click", ev => {
  const r = ev.target.closest("[data-refresh]");
  if (r){ ev.stopPropagation(); refreshAccount(Number(r.dataset.refresh)); return; }
  const v = ev.target.closest("[data-reveal]");
  if (v){ const row = accounts[Number(v.dataset.reveal)]; if (row){ row.reveal = !row.reveal; render(); } return; }
  const c = ev.target.closest("[data-copy-key]");
  if (c){ copyKey(Number(c.dataset.copyKey)); return; }
  const chip = ev.target.closest(".chip[data-state]");
  if (chip){ const row = accounts[active]; if (row){ row.rs = chip.dataset.state || ""; applyRecentFilter(row); } return; }
  if (ev.target.closest("[data-csv]")){ const row = accounts[active]; if (row && row.A) exportRecentCsv(row.A); }
});

document.addEventListener("input", ev => {
  const f = ev.target.closest("[data-filter]");
  if (f){ const row = accounts[active]; if (row){ row.rq = f.value; applyRecentFilter(row); } }
});

// Hides payment rows that do not match the text filter or the state chip. Pure show/hide:
// nothing is re-rendered, so the filter box keeps focus while typing.
function applyRecentFilter(row){
  const tbl = document.getElementById("recent-tbl"); if (!tbl || !row) return;
  const box = tbl.closest(".mod");
  const q = (row.rq || "").trim().toLowerCase(), st = row.rs || "";
  const inp = box.querySelector("[data-filter]"); if (inp && inp.value !== (row.rq || "")) inp.value = row.rq || "";
  box.querySelectorAll(".chip[data-state]").forEach(b => b.classList.toggle("on", (b.dataset.state || "") === st));
  let shown = 0, total = 0;
  tbl.querySelectorAll("tbody tr[data-row]").forEach(tr => {
    total++;
    const okQ = !q || tr.dataset.row.includes(q);
    const okS = !st || tr.dataset.state === st || (st === "refund" && /refund/.test(tr.dataset.state));
    tr.hidden = !(okQ && okS); if (okQ && okS) shown++;
  });
  const cnt = box.querySelector("[data-shown]");
  if (cnt) cnt.textContent = total ? (shown === total ? `${total} shown` : `${shown} of ${total} shown`) : "";
  if (row.A) updateBulkBar(row.A);
}

// Selection lives on the account (A._sel, a Set of charge ids) so it survives re-renders.
// Only the bar and the checkboxes are touched here; the table is not redrawn.
function updateBulkBar(A){
  const bar = document.querySelector("[data-bulkbar]"); if (!bar) return;
  const sel = A._sel || (A._sel = new Set());
  for (const id of [...sel]){ const c = A.recent.find(x => x.id === id); if (!c || !canRefund(c)) sel.delete(id); }
  document.querySelectorAll("[data-sel]").forEach(cb => { cb.checked = sel.has(cb.dataset.sel); });
  const all = document.querySelector("[data-sel-all]");
  if (all){
    const vis = [...document.querySelectorAll("tr[data-row]:not([hidden]) [data-sel]")];
    const on = vis.filter(cb => cb.checked).length;
    all.checked = vis.length > 0 && on === vis.length; all.indeterminate = on > 0 && on < vis.length;
  }
  if (!sel.size){ bar.hidden = true; bar.innerHTML = ""; return; }
  const tot = {};
  for (const id of sel){ const c = A.recent.find(x => x.id === id); tot[c.currency] = (tot[c.currency]||0) + c.refundable; }
  const totTxt = Object.entries(tot).map(([cur,v]) => money(v,cur)).join(" · ");
  bar.hidden = false;
  bar.innerHTML = `<span><b>${sel.size}</b> selected · ${esc(totTxt)}</span><span class="spacer"></span>
    <button type="button" class="btn-sm" data-sel-clear>Clear</button>
    <button type="button" class="btn-sm danger" data-bulk-refund>Refund selected</button>`;
}

document.addEventListener("change", ev => {
  const row = accounts[active]; const A = row && row.A; if (!A) return;
  const cb = ev.target.closest("[data-sel]");
  if (cb){ (A._sel || (A._sel = new Set()))[cb.checked ? "add" : "delete"](cb.dataset.sel); updateBulkBar(A); return; }
  if (ev.target.closest("[data-sel-all]")){
    const on = ev.target.checked, sel = A._sel || (A._sel = new Set());
    document.querySelectorAll("tr[data-row]:not([hidden]) [data-sel]").forEach(c => sel[on ? "add" : "delete"](c.dataset.sel));
    updateBulkBar(A);
  }
});

// Builds a CSV of the listed payments in the browser and hands it to the download manager.
function exportRecentCsv(A){
  const unit = (minor, cur) => ((minor || 0) / (ZERO_DEC.has((cur || "").toUpperCase()) ? 1 : 100)).toFixed(ZERO_DEC.has((cur || "").toUpperCase()) ? 0 : 2);
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const head = ["when","state","amount","currency","stripe_fee","net_to_you","settlement_currency","exchange_rate","clears_on","customer","card","note","charge_id"];
  const rows = A.recent.map(c => [new Date(c.created*1000).toISOString(), c.state, unit(c.amount,c.currency), (c.currency||"").toUpperCase(),
    c.settle ? unit(c.settle.fee,c.settle.currency) : "", c.settle ? unit(c.settle.net,c.settle.currency) : "",
    c.settle ? (c.settle.currency||"").toUpperCase() : "", c.settle && c.settle.rate ? c.settle.rate : "",
    c.settle && c.settle.on ? new Date(c.settle.on*1000).toISOString().slice(0,10) : "", c.who, c.brand, c.note, c.id].map(q).join(","));
  const blob = new Blob([[head.join(",")].concat(rows).join("\n")], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `payments-${A.id}-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// Copies the full key to the clipboard and flips the button to "Copied" for a moment.
// If the browser blocks the clipboard, the key is revealed so it can be selected by hand.
async function copyKey(i){
  const row = accounts[i];
  if (!row || !row.key) return;
  let ok = false;
  try {
    if (navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(row.key); ok = true; }
  } catch(e){ ok = false; }
  if (!ok){
    try {
      const ta = document.createElement("textarea");
      ta.value = row.key; ta.setAttribute("readonly",""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy") === true; ta.remove();
    } catch(e){ ok = false; }
  }
  clearTimeout(row.copiedTimer);
  if (ok){
    row.copied = true; row.copyErr = null; render();
    row.copiedTimer = setTimeout(() => { row.copied = false; render(); }, 1600);
  } else {
    row.reveal = true; row.copyErr = "Clipboard blocked by the browser — the key is shown, select it to copy."; render();
    row.copiedTimer = setTimeout(() => { row.copyErr = null; render(); }, 4000);
  }
}

/* ---------- action clicks ---------- */
const val = id => (document.getElementById(id) || {}).value || "";
const minor = (txt, cur) =>
  Math.round(Number(txt) * (ZERO_DEC.has((cur||"").toUpperCase()) ? 1 : 100));

document.addEventListener("click", async ev => {
  const row = accounts[active];
  const A = row && row.A;
  const key = row && row.key;

  if (ev.target.closest("[data-flash-close]")){ closeDialog(); return; }
  if (ev.target.closest("[data-ask-no]")){ closeDialog(); return; }
  if (ev.target.closest("[data-ask-yes]")){ confirmNow(); return; }
  const copy = ev.target.closest("[data-copy]");
  if (copy){
    try { await navigator.clipboard.writeText(copy.dataset.copy); copy.textContent = "Copied"; }
    catch { copy.textContent = "Select it manually"; }
    return;
  }
  if (!A || !key) return;

  /* accept a dispute: close it without evidence, the customer keeps the money */
  const ad = ev.target.closest("[data-accept-dispute]");
  if (ad){
    const d = A.disputes.find(x => x.id === ad.dataset.acceptDispute);
    if (!d) return;
    ask({
      what: `Accept this dispute for ${money(d.amount, d.currency)}?`,
      detail: `The customer keeps the <b>${esc(money(d.amount, d.currency))}</b> their bank already took back to their card, and the
        dispute is recorded as lost. Stripe's dispute fee is not returned. This cannot be undone and no evidence can be sent afterwards.`,
      label: "Accept dispute",
      run: async () => {
        const out = await sp(key, `disputes/${d.id}/close`, {}, idemKey());
        return {text: `Dispute accepted. ${money(d.amount, d.currency)} stays with the customer. Status: ${lbl(out.status)}.`};
      }
    });
    return;
  }

  /* selection + bulk refund */
  if (ev.target.closest("[data-sel-clear]")){ if (A._sel) A._sel.clear(); updateBulkBar(A); return; }
  if (ev.target.closest("[data-bulk-refund]")){
    const items = [...(A._sel || [])].map(id => A.recent.find(x => x.id === id))
      .filter(c => c && canRefund(c));
    if (!items.length) return;
    const tot = {}; items.forEach(c => { tot[c.currency] = (tot[c.currency]||0) + c.refundable; });
    const totTxt = Object.entries(tot).map(([cur,v]) => money(v,cur)).join(" · ");
    const n = items.length;
    ask({
      what: `Refund ${n} payment${n>1?"s":""} in full?`,
      detail: `<b>${esc(totTxt)}</b> goes back to these customers. Refunds cannot be undone; they are sent one after another.
        <ul class="dlg-list">${items.map(c => `<li>${esc(money(c.refundable,c.currency))} · ${esc(c.who)} · ${esc(dt(c.created))}</li>`).join("")}</ul>`,
      label: `Refund ${n} payment${n>1?"s":""}`,
      run: async (_, progress) => {
        const done = [], failed = [];
        for (let i = 0; i < items.length; i++){
          const c = items[i];
          progress(`Refunding ${i+1} of ${n}: ${money(c.refundable,c.currency)} to ${c.who}…`);
          try { await sp(key, "refunds", {charge: c.id, amount: c.refundable}, idemKey()); done.push(c); }
          catch(e){ failed.push({c, err: e.message || String(e)}); }
        }
        if (A._sel) A._sel.clear();
        updateBulkBar(A);
        const dTot = {}; done.forEach(c => { dTot[c.currency] = (dTot[c.currency]||0) + c.refundable; });
        const dTxt = Object.entries(dTot).map(([cur,v]) => money(v,cur)).join(" · ");
        const text = `Refunded ${done.length} of ${n} payment${n>1?"s":""}${done.length ? " · " + dTxt : ""}.`;
        const groups = {};
        failed.forEach(f => { (groups[f.err] || (groups[f.err] = [])).push(`${money(f.c.refundable,f.c.currency)} · ${f.c.who}`); });
        return {ok: done.length > 0, partial: done.length > 0 && failed.length > 0, text,
                groups: Object.entries(groups).map(([reason, items]) => ({reason, items}))};
      }
    });
    return;
  }

  /* refund */
  const rf = ev.target.closest("[data-refund]");
  if (rf){
    const c = A.recent.find(x => x.id === rf.dataset.refund);
    if (!c) return;
    ask({
      what: `Refund ${money(c.refundable, c.currency)}?`,
      detail: `To ${esc(c.who)} · ${esc(dt(c.created))}. Refunds cannot be undone. Edit the amount for a partial refund.`,
      label: "Refund now",
      amount: {value: c.refundable, currency: c.currency, max: c.refundable},
      run: async amt => {
        const out = await sp(key, "refunds", {charge: c.id, amount: amt}, idemKey());
        return {text: `Refunded ${money(out.amount, out.currency)} to ${c.who}.`};
      }
    });
    return;
  }

  /* send payout */
  const po = ev.target.closest("[data-payout]");
  if (po){
    const cur = po.dataset.payout, max = Number(po.dataset.max);
    ask({
      what: `Pay out ${money(max, cur)} to your bank?`,
      detail: `${A.bank ? esc((A.bank.bank_name||"your bank") + " ····" + (A.bank.last4||"")) : "Your default bank account"}. Typically arrives in a few working days.`,
      label: "Send payout",
      amount: {value: max, currency: cur, max},
      run: async amt => {
        const out = await sp(key, "payouts", {amount: amt, currency: cur.toLowerCase()}, idemKey());
        return {text: `Payout of ${money(out.amount, out.currency)} sent — arriving ${d8(out.arrival_date)}.`};
      }
    });
    return;
  }

  /* cancel payout */
  const cp = ev.target.closest("[data-cancel-payout]");
  if (cp){
    const id = cp.dataset.cancelPayout;
    const p = A.payouts.find(x => x.id === id);
    ask({
      what: `Cancel this payout?`,
      detail: p ? `${money(p.amount,p.currency)} due ${d8(p.arrival)}. The money returns to your Stripe balance.` : "",
      label: "Cancel payout",
      run: async () => {
        await sp(key, "payouts/" + id + "/cancel", {}, idemKey());
        return {text: "Payout cancelled. The funds are back in your available balance."};
      }
    });
    return;
  }

  /* payment link */
  if (ev.target.closest("[data-make-link]")){
    const cur = (val("pl-cur") || A.currency || "gbp").toLowerCase();
    const amt = minor(val("pl-amount"), cur);
    const desc = val("pl-desc").trim() || "Payment";
    if (!amt || amt <= 0){ flash = {ok:false, text:"Enter an amount first."}; render(); return; }
    ask({
      what: `Create a payment link for ${money(amt, cur)}?`,
      detail: `Labelled "${esc(desc)}". Anyone with the link can pay it, as many times as it is used.`,
      label: "Create link",
      reread: false,
      run: async () => {
        const price = await sp(key, "prices", {
          currency: cur, unit_amount: amt, "product_data[name]": desc
        }, idemKey());
        const link = await sp(key, "payment_links", {
          "line_items[0][price]": price.id, "line_items[0][quantity]": 1
        }, idemKey());
        return {text: "Payment link created.", code: link.url, link: link.url};
      }
    });
    return;
  }

  /* discount code */
  if (ev.target.closest("[data-make-coupon]")){
    const pctOff = Number(val("dc-pct"));
    const code = val("dc-code").trim().toUpperCase();
    if (!pctOff || pctOff < 1 || pctOff > 100){ flash = {ok:false, text:"Enter a percent between 1 and 100."}; render(); return; }
    if (!code){ flash = {ok:false, text:"Enter a code customers will type."}; render(); return; }
    ask({
      what: `Create ${pctOff}% off as "${esc(code)}"?`,
      detail: "Customers can redeem it at checkout until you deactivate it in Stripe.",
      label: "Create code",
      reread: false,
      run: async () => {
        const coupon = await sp(key, "coupons", {percent_off: pctOff, duration: "once"}, idemKey());
        const promo = await sp(key, "promotion_codes", {coupon: coupon.id, code}, idemKey());
        return {text: `${pctOff}% off is live.`, code: promo.code};
      }
    });
    return;
  }

  /* invoice */
  if (ev.target.closest("[data-make-invoice]")){
    const email = val("inv-email").trim();
    const cur = (A.currency || "gbp").toLowerCase();
    const amt = minor(val("inv-amount"), cur);
    const days = Math.max(1, Number(val("inv-days")) || 7);
    const desc = val("inv-desc").trim() || "Amount due";
    if (!email || !amt){ flash = {ok:false, text:"Enter an email and an amount."}; render(); return; }
    ask({
      what: `Invoice ${esc(email)} for ${money(amt, cur)}?`,
      detail: `Due in ${days} day${days===1?"":"s"}. Stripe emails it to them straight away.`,
      label: "Create and send",
      reread: false,
      run: async () => {
        const found = await sq(key, "customers", {email, limit: 1});
        const cust = (found.data && found.data[0])
          ? found.data[0]
          : await sp(key, "customers", {email}, idemKey());
        await sp(key, "invoiceitems", {customer: cust.id, amount: amt, currency: cur, description: desc}, idemKey());
        const inv = await sp(key, "invoices", {
          customer: cust.id, collection_method: "send_invoice", days_until_due: days
        }, idemKey());
        await sp(key, "invoices/" + inv.id + "/finalize", {}, idemKey());
        const sent = await sp(key, "invoices/" + inv.id + "/send", {}, idemKey());
        return {text: `Invoice ${sent.number || ""} sent to ${email}.`,
                link: sent.hosted_invoice_url || null};
      }
    });
    return;
  }
});

$("#tabs").addEventListener("click", ev => {
  if (ev.target.closest("[data-refresh]")) return;
  const close = ev.target.closest("[data-close]");
  if (close){
    ev.stopPropagation();
    accounts.splice(Number(close.dataset.close), 1);
    if (active >= accounts.length) active = Math.max(0, accounts.length - 1);
    render(); return;
  }
  const t = ev.target.closest(".tab");
  if (t){ active = Number(t.dataset.i); render(); }
});

$("#form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const key = $("#key").value.trim();
  if (!key) return;
  const days = Number($("#days").value);
  const btn = $("#add");
  btn.disabled = true; btn.textContent = "Reading…";
  try {
    const A = await load(key, days);
    accounts.push({key, A, at: Date.now()});
  } catch(e){
    accounts.push({error: e.message || String(e)});
  } finally {
    active = accounts.length - 1;
    btn.disabled = false; btn.textContent = "Add account";
    $("#key").value = "";
    render();
    $("#key").focus();
  }
});

$("#reset").addEventListener("click", () => {
  accounts.length = 0; active = 0;
  $("#key").value = "";
  render(); $("#key").focus();
});

// Light / dark switch. The choice is remembered in this browser only; keys are never stored.
(function(){
  let saved = null; try { saved = localStorage.getItem("theme"); } catch(e){}
  if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
  const b = document.getElementById("theme");
  const current = () => document.documentElement.dataset.theme
    || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const paint = () => { b.textContent = current() === "dark" ? "☀ Light" : "☾ Dark"; };
  b.addEventListener("click", () => {
    const next = current() === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch(e){}
    paint();
  });
  paint();
})();

render();
</script>
</body>
</html>
